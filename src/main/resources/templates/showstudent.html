<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Show Student</title>
</head>
<body>
<h1>Student Info</h1>

<table border="1">
<thead>
<tr>
<th>Id</th>
<th>RollNo</th>
<th>Name</th>
<th>Gender</th>
<th>City</th>
<th>Action</th>
</tr>
</thead>

<tbody>
<tr th:each="s :${list}">
<td th:text="${s.id}"></td>
<td th:text="${s.rollno}"></td>
<td th:text="${s.name}"></td>
<td th:text="${s.gender}"></td>
<td th:text="${s.city}"></td>
<td><a th:href="@{/studentportal/update/{id}(id=${s.id})}"><button>Update</button></a>
<a th:href="@{/studentportal/delete/{id}(id=${s.id})}"><button>Delete</button></a></td>


</tr>
</tbody>
</table>
</body>
</html>
